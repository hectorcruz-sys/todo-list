<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lista de Tareas</title>

  <link rel="icon" href="icono.png">

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="contenedor">

    <!-- Logo -->
    <img src="logo.png" class="logo">

    <!-- Título -->
    <h1>Lista de Tareas</h1>

    <!-- Frase motivacional -->
    <p id="frase"></p>

    <!-- Input -->
    <div class="input-area">

      <input
        type="text"
        id="tarea"
        placeholder="Escribe una tarea..."
      >

      <button id="agregar">
        Agregar
      </button>

    </div>

    <!-- Lista -->
    <ul id="lista-tareas"></ul>

    <!-- Música -->
    <button id="musicaBtn">
      🎵 Música
    </button>

    <!-- Modo oscuro -->
    <button id="modoOscuro">
      🌙 Modo Oscuro
    </button>

  </div>

  <!-- AUDIO ONLINE -->

<div class="youtube-player">

  <iframe
    width="100%"
    height="200"
    src="https://www.youtube.com/watch?v=DhHGDOgjie4&list=RDDhHGDOgjie4&start_radio=1&pp=ygUNZXRlcm5hbCB5b3V0aKAHAQ%3D%3D"
    title="YouTube video player"
    frameborder="0"
    allow="autoplay; encrypted-media"
    allowfullscreen>
  </iframe>

</div>
  <script src="script.js"></script>

</body>
</html>
