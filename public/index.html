<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lista de Tareas</title>

  <link rel="icon" href="icono.png">

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="contenedor">

    <!-- Logo -->
    <img src="logo.png" class="logo">

    <!-- Título -->
    <h1>Lista de Tareas</h1>

    <!-- Frase -->
    <p id="frase"></p>

    <!-- Input -->
    <div class="input-area">

      <input
        type="text"
        id="tarea"
        placeholder="Escribe una tarea..."
      >

      <button id="agregar">
        Agregar
      </button>

    </div>

    <!-- Lista -->
    <ul id="lista-tareas"></ul>

    <!-- Música YouTube -->

    <div class="youtube-player">

      <iframe
        width="100%"
        height="200"
        src="https://www.youtube.com/embed/W6hasdx4a1I?autoplay=1&mute=1&loop=1&playlist=W6hasdx4a1I"        title="YouTube video player"
        frameborder="0"
        allow="autoplay; encrypted-media"
        allowfullscreen>
      </iframe>
      
      <iframe width="560" height="315" src="https://www.youtube.com/embed/KOxJnce4cqI?si=QOHSEoPDeNcz4FD9" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    </div>

    <!-- Modo oscuro -->

    <button id="modoOscuro">
      🌙 Modo Oscuro
    </button>

  </div>

  <script src="script.js"></script>

</body>
</html>
